<p class="note">Showing {{ preview_options[selection][0].lower() }}.</p>
{% if preview.rows %}
  <div class="table-wrap data-preview" tabindex="0" role="region" aria-label="Dataset preview; scroll horizontally to see all columns">
    <table>
      <thead>
        <tr>{% for column in preview.columns %}<th scope="col">{{ column }}</th>{% endfor %}</tr>
      </thead>
      <tbody>
        {% for row in preview.rows %}
          <tr>{% for value in row %}<td>{{ value }}</td>{% endfor %}</tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p>No games found in the dataset.</p>
{% endif %}
